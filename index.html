<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Admin - Gerenciador de Cursos</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Devicon Icons (Ícones de Linguagens estilo VS Code) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel de Controle de Cursos</h1>
        </header>

        <div class="kpi-grid">
            <div class="kpi-card">
                <span>Total de Cursos</span>
                <p id="kpi-total">0</p>
            </div>
            <div class="kpi-card">
                <span>Total de Aulas</span>
                <p id="kpi-aulas">0</p>
            </div>
            <div class="kpi-card">
                <span>Carga Horária Total</span>
                <p id="kpi-horas">0h</p>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h2 id="form-title">Cadastrar Novo Curso</h2>
                <input type="hidden" id="curso-id">
                
                <div class="form-group">
                    <label for="titulo">Título do Curso</label>
                    <input type="text" id="titulo" placeholder="Ex: Python Avançado">
                </div>

                <div class="form-group">
                    <label for="categoria">Tecnologia / Categoria</label>
                    <select id="categoria" style="width: 100%; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 12px; color: var(--text-main); font-size: 0.95rem; outline: none;">
                        <option value="Python">Python</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="Java">Java</option>
                        <option value="C#">C# (.NET)</option>
                        <option value="PHP">PHP</option>
                        <option value="React">React</option>
                        <option value="HTML/CSS">HTML/CSS</option>
                        <option value="SQL">SQL / Banco de Dados</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="aulas">Qtd. de Aulas</label>
                    <input type="number" id="aulas" placeholder="Ex: 40">
                </div>

                <div class="form-group">
                    <label for="horas">Carga Horária (horas)</label>
                    <input type="number" id="horas" placeholder="Ex: 20">
                </div>

                <div class="btn-group">
                    <button class="btn-primary" id="btn-submit" onclick="salvarCurso()">Salvar Curso</button>
                    <button class="btn-cancel" id="btn-cancel" onclick="limparFormulario()">Cancelar</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header" style="display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
                    <h2>Cursos Cadastrados</h2>
                    <div style="display: flex; gap: 8px; flex: 1; max-width: 300px;">
                        <input type="text" id="input-busca" placeholder="Buscar curso..." oninput="carregarCursos()" style="width: 100%; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 12px; color: var(--text-main); font-size: 0.85rem; outline: none;">
                    </div>
                    <button class="btn-refresh" onclick="carregarCursos()">↻ Atualizar</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título / Tecnologia</th>
                            <th>Métricas</th>
                            <th style="text-align: right;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-cursos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL CUSTOMIZADO DARK UI -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-box">
            <h3>Excluir Curso</h3>
            <p id="modal-msg">Tem certeza que deseja remover este curso do banco?</p>
            <div class="modal-actions">
                <button class="btn-cancel" style="display:inline-block;" onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirm-delete" id="btn-confirm-action">Sim, Excluir</button>
            </div>
        </div>
    </div>

    <div id="toast">Operação realizada com sucesso!</div>

    <script src="script.js"></script>
</body>
</html>
