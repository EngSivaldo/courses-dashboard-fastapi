<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Admin - Gerenciador de Cursos</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Devicon Icons (Ícones de Linguagens estilo VS Code) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --border-color: #475569;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 40px 20px; display: flex; justify-content: center; }
        
        .container { width: 100%; max-width: 1100px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; }
        header h1 { font-size: 1.75rem; font-weight: 700; }

        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .kpi-card { background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 16px; border-radius: 10px; }
        .kpi-card span { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
        .kpi-card p { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-top: 4px; }

        .dashboard-grid { display: grid; grid-template-columns: 360px 1fr; gap: 24px; }
        @media (max-width: 850px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; font-weight: 600; }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input { width: 100%; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 12px; color: var(--text-main); font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: var(--primary); }

        .btn-group { display: flex; gap: 10px; margin-top: 24px; }
        button { border: none; padding: 10px 16px; font-weight: 600; font-size: 0.9rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background-color: var(--primary); color: white; width: 100%; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-cancel { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); display: none; }
        .btn-refresh { background-color: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-color); font-size: 0.8rem; padding: 6px 12px; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: rgba(255,255,255,0.02); color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        td { padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; }
        tr:hover { background-color: rgba(255,255,255,0.02); }

        /* Estilização das Linguagens (VS Code Style) */
        .tech-cell { display: flex; align-items: center; gap: 10px; }
        .tech-cell i { font-size: 1.4rem; }

        .badge-id { background-color: var(--bg-input); color: var(--text-muted); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        .btn-edit { background-color: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3); }
        .btn-edit:hover { background-color: var(--warning); color: black; }
        .btn-delete { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-delete:hover { background-color: var(--danger); color: white; }

        /* MODAL CUSTOMIZADO (SUBSTITUI O CONFIRM) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 400px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; }
        .modal-box h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text-main); }
        .modal-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }
        .btn-confirm-delete { background-color: var(--danger); color: white; }
        .btn-confirm-delete:hover { background-color: #dc2626; }

        #toast { position: fixed; bottom: 20px; right: 20px; background-color: var(--success); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        #toast.show { opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel de Controle de Cursos</h1>
        </header>

        <div class="kpi-grid">
            <div class="kpi-card">
                <span>Total de Cursos</span>
                <p id="kpi-total">0</p>
            </div>
            <div class="kpi-card">
                <span>Total de Aulas</span>
                <p id="kpi-aulas">0</p>
            </div>
            <div class="kpi-card">
                <span>Carga Horária Total</span>
                <p id="kpi-horas">0h</p>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h2 id="form-title">Cadastrar Novo Curso</h2>
                <input type="hidden" id="curso-id">
                
                <div class="form-group">
                    <label for="titulo">Título do Curso</label>
                    <input type="text" id="titulo" placeholder="Ex: Python Avançado">
                </div>

                <div class="form-group">
                    <label for="categoria">Tecnologia / Categoria</label>
                    <select id="categoria" style="width: 100%; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 12px; color: var(--text-main); font-size: 0.95rem; outline: none;">
                        <option value="Python">Python</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="Java">Java</option>
                        <option value="C#">C# (.NET)</option>
                        <option value="PHP">PHP</option>
                        <option value="React">React</option>
                        <option value="HTML/CSS">HTML/CSS</option>
                        <option value="SQL">SQL / Banco de Dados</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="aulas">Qtd. de Aulas</label>
                    <input type="number" id="aulas" placeholder="Ex: 40">
                </div>

                <div class="form-group">
                    <label for="horas">Carga Horária (horas)</label>
                    <input type="number" id="horas" placeholder="Ex: 20">
                </div>

                <div class="btn-group">
                    <button class="btn-primary" id="btn-submit" onclick="salvarCurso()">Salvar Curso</button>
                    <button class="btn-cancel" id="btn-cancel" onclick="limparFormulario()">Cancelar</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header" style="display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;">
                    <h2>Cursos Cadastrados</h2>
                    <div style="display: flex; gap: 8px; flex: 1; max-width: 300px;">
                        <input type="text" id="input-busca" placeholder="Buscar curso..." oninput="carregarCursos()" style="width: 100%; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 12px; color: var(--text-main); font-size: 0.85rem; outline: none;">
                    </div>
                    <button class="btn-refresh" onclick="carregarCursos()">↻ Atualizar</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título / Tecnologia</th>
                            <th>Métricas</th>
                            <th style="text-align: right;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-cursos"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL CUSTOMIZADO DARK UI -->
    <div class="modal-overlay" id="delete-modal">
        <div class="modal-box">
            <h3>Excluir Curso</h3>
            <p id="modal-msg">Tem certeza que deseja remover este curso do banco?</p>
            <div class="modal-actions">
                <button class="btn-cancel" style="display:inline-block;" onclick="fecharModal()">Cancelar</button>
                <button class="btn-confirm-delete" id="btn-confirm-action">Sim, Excluir</button>
            </div>
        </div>
    </div>

    <div id="toast">Operação realizada com sucesso!</div>

    <script>
        const API_URL = "http://127.0.0.1:8000/cursos";
        let idParaDeletar = null;

        // Mapeamento de Ícones Devicon baseados na Categoria ou Título
        function obterIconeLinguagem(titulo) {
            const t = titulo.toLowerCase();
            if (t.includes("python")) return '<i class="devicon-python-plain colored"></i>';
            if (t.includes("javascript") || t.includes("js")) return '<i class="devicon-javascript-plain colored"></i>';
            if (t.includes("java")) return '<i class="devicon-java-plain colored"></i>';
            if (t.includes("c#") || t.includes("csharp")) return '<i class="devicon-csharp-plain colored"></i>';
            if (t.includes("php")) return '<i class="devicon-php-plain colored"></i>';
            if (t.includes("react")) return '<i class="devicon-react-original colored"></i>';
            if (t.includes("html") || t.includes("css")) return '<i class="devicon-html5-plain colored"></i>';
            if (t.includes("sql")) return '<i class="devicon-sqldeveloper-plain colored"></i>';
            return '<i class="devicon-code-style-plain" style="color: var(--primary);"></i>';
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.classList.add("show");
            setTimeout(() => toast.classList.remove("show"), 3000);
        }

        async function carregarCursos() {
            try {
                const inputBusca = document.getElementById("input-busca");
                const termo = inputBusca ? inputBusca.value.trim() : "";
                const url = termo ? `${API_URL}?q=${encodeURIComponent(termo)}` : API_URL;

                const resposta = await fetch(url);
                const cursos = await resposta.json();
                
                const tabela = document.getElementById("tabela-cursos");
                tabela.innerHTML = "";
                
                let totalAulas = 0;
                let totalHoras = 0;

                cursos.forEach(c => {
                    totalAulas += c.aulas;
                    totalHoras += c.horas;
                });

                document.getElementById("kpi-total").innerText = cursos.length;
                document.getElementById("kpi-aulas").innerText = totalAulas;
                document.getElementById("kpi-horas").innerText = `${totalHoras}h`;

                if(cursos.length === 0) {
                    tabela.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 32px;">Nenhum curso encontrado.</td></tr>`;
                    return;
                }

                cursos.forEach(curso => {
                    const tr = document.createElement("tr");
                    const termoIcone = curso.categoria || curso.titulo;
                    const icone = obterIconeLinguagem(termoIcone);
                    
                    tr.innerHTML = `
                        <td><span class="badge-id">#${curso.id}</span></td>
                        <td>
                            <div class="tech-cell">
                                ${icone}
                                <strong>${curso.titulo}</strong>
                            </div>
                        </td>
                        <td style="color: var(--text-muted);">${curso.aulas} aulas • ${curso.horas}h</td>
                        <td style="text-align: right;">
                            <button class="btn-edit btn-sm" onclick="prepararEdicao(${curso.id}, '${curso.titulo.replace(/'/g, "\\'")}', '${(curso.categoria || "Outros").replace(/'/g, "\\'")}', ${curso.aulas}, ${curso.horas})">Editar</button>
                            <button class="btn-delete btn-sm" onclick="abrirModalDeletar(${curso.id}, '${curso.titulo.replace(/'/g, "\\'")}')">Excluir</button>
                        </td>
                    `;
                    tabela.appendChild(tr);
                });
            } catch (err) {
                showToast("Erro ao conectar com a API!");
            }
        }

        async function salvarCurso() {
            const id = document.getElementById("curso-id").value;
            const titulo = document.getElementById("titulo").value;
            const categoria = document.getElementById("categoria").value;
            const aulas = parseInt(document.getElementById("aulas").value);
            const horas = parseInt(document.getElementById("horas").value);

            if (!titulo || isNaN(aulas) || isNaN(horas) || aulas <= 0 || horas <= 0) {
                showToast("Preencha todos os campos com valores válidos!");
                return;
            }

            const payload = { titulo, categoria, aulas, horas };

            try {
                if (id) {
                    await fetch(`${API_URL}/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    showToast("Curso atualizado com sucesso!");
                } else {
                    await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    showToast("Curso cadastrado no banco!");
                }

                limparFormulario();
                carregarCursos();
            } catch (err) {
                showToast("Erro ao salvar curso!");
            }
        }

        function abrirModalDeletar(id, titulo) {
            idParaDeletar = id;
            document.getElementById("modal-msg").innerText = `Tem certeza que deseja remover o curso "#${id} - ${titulo}"?`;
            document.getElementById("delete-modal").classList.add("active");
        }

        function fecharModal() {
            idParaDeletar = null;
            document.getElementById("delete-modal").classList.remove("active");
        }

        document.getElementById("btn-confirm-action").onclick = async function() {
            if(idParaDeletar) {
                await fetch(`${API_URL}/${idParaDeletar}`, { method: "DELETE" });
                showToast("Curso removido com sucesso!");
                fecharModal();
                carregarCursos();
            }
        };

        function prepararEdicao(id, titulo, categoria, aulas, horas) {
            document.getElementById("curso-id").value = id;
            document.getElementById("titulo").value = titulo;
            document.getElementById("categoria").value = categoria || "Outros";
            document.getElementById("aulas").value = aulas;
            document.getElementById("horas").value = horas;

            document.getElementById("form-title").innerText = `Editar Curso #${id}`;
            document.getElementById("btn-submit").innerText = "Atualizar Curso";
            document.getElementById("btn-cancel").style.display = "inline-block";
        }

        function limparFormulario() {
            document.getElementById("form-title").innerText = "Cadastrar Novo Curso";
            document.getElementById("curso-id").value = "";
            document.getElementById("titulo").value = "";
            document.getElementById("categoria").value = "Python";
            document.getElementById("aulas").value = "";
            document.getElementById("horas").value = "";
            
            document.getElementById("btn-submit").innerText = "Salvar Curso";
            document.getElementById("btn-cancel").style.display = "none";
        }

        carregarCursos();
    </script>
</body>
</html>
